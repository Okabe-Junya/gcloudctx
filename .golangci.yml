version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: standard
  enable:
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - whitespace
  settings:
    gosec:
      # G204/G304: gcloudctx is a CLI that intentionally shells out to
      # gcloud/fzf and reads config files from user-controlled paths.
      excludes:
        - G204
        - G304
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
        path: _test\.go
      # cobra's RunE/ValidArgsFunction callback signature is fixed, so cmd
      # is routinely unused; revive's default unused-parameter rule would
      # otherwise flag every handler in this package.
      - linters:
          - revive
        text: 'unused-parameter'
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
